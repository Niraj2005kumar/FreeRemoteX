<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - RemoteX</title>
  <meta name="description" content="Sign in to your RemoteX account for permission-governed remote desktop access.">
  <link rel="icon" type="image/svg+xml" href="assets/logo/remotex-mark.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="auth-wrapper">
    <!-- Brand Header -->
    <div class="auth-brand">
      <a href="index.html">
        <img src="assets/logo/remotex-logo.svg" alt="RemoteX Logo" class="auth-brand-logo">
      </a>
      <span class="auth-badge">Permission-First Remote Platform</span>
    </div>

    <!-- Login Card -->
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Enter your credentials to access your RemoteX workspace</p>
      </div>

      <form id="login-form" class="auth-form" novalidate>
        <!-- Email field -->
        <div class="form-group">
          <label for="email" class="form-label">
            Email address <span class="required" aria-hidden="true">*</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="operator@company.com"
            autocomplete="email"
            required
          >
          <div class="form-error" id="email-error"></div>
        </div>

        <!-- Password field -->
        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label for="password" class="form-label" style="margin-bottom:0;">
              Password <span class="required" aria-hidden="true">*</span>
            </label>
          </div>
          <div class="input-group">
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="••••••••••••"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              class="input-addon-btn"
              id="toggle-password-btn"
              aria-label="Toggle password visibility"
              tabindex="-1"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-open">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-closed sr-only">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <div class="form-error" id="password-error"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-lg" id="submit-btn" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <!-- Card Footer -->
      <div class="auth-card-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>

    <!-- Security statement -->
    <div class="auth-security-notice">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span>TLS encrypted. Granular session permissions enforced.</span>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
