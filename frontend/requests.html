<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connection Requests - RemoteX</title>
  <meta name="description" content="Review and govern inbound and outbound remote connection requests.">
  <link rel="icon" type="image/svg+xml" href="assets/logo/remotex-mark.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/requests.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="sidebar-brand">
          <img src="assets/logo/remotex-logo.svg" alt="RemoteX">
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-title">Workspace</div>
        <a href="dashboard.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="requests.html" class="nav-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7.5" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          Requests
          <span class="badge-counter" id="sidebar-request-counter" style="display:none;">0</span>
        </a>
        <a href="session.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          Active Session
        </a>

        <div class="sidebar-section-title">Account</div>
        <a href="profile.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-mini-card">
          <div class="user-avatar" id="sidebar-avatar">--</div>
          <div class="user-info">
            <div class="user-name" id="sidebar-name">Loading...</div>
            <div class="user-remote-id" id="sidebar-remote-id">RX-•••••</div>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="logout-btn" style="width:100%; justify-content:flex-start; color:var(--text-muted);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-sidebar-toggle" aria-label="Toggle navigation menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="page-title">Connection Requests</h1>
        </div>

        <div class="header-right">
          <div class="connection-status-pill">
            <span class="status-dot online ws-status-dot"></span>
            <span class="ws-status-text">Real-time Online</span>
          </div>

          <a href="profile.html" class="user-avatar" id="header-avatar" style="width:32px; height:32px; font-size:0.75rem; text-decoration:none;" title="Profile">
            --
          </a>
        </div>
      </header>

      <main class="page-body">
        <div class="requests-layout">
          <div class="requests-header">
            <div>
              <p style="color:var(--text-secondary); font-size:0.9375rem;">
                Manage participant handshakes. Accept or decline requests to initiate permission-governed sessions.
              </p>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" id="refresh-requests-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              Refresh
            </button>
          </div>

          <!-- Tabs -->
          <div class="tabs-header">
            <button type="button" class="tab-btn active" data-tab="incoming-tab">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
              Incoming Requests
              <span class="tab-badge" id="incoming-count">0</span>
            </button>
            <button type="button" class="tab-btn" data-tab="outgoing-tab">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
              Outgoing Requests
              <span class="tab-badge" id="outgoing-count">0</span>
            </button>
          </div>

          <!-- Incoming Requests Tab Content -->
          <div class="tab-content active" id="incoming-tab">
            <div id="incoming-requests-list" class="requests-card-grid">
              <div class="skeleton" style="height:80px; border-radius:var(--radius-lg);"></div>
            </div>
          </div>

          <!-- Outgoing Requests Tab Content -->
          <div class="tab-content" id="outgoing-tab">
            <div id="outgoing-requests-list" class="requests-card-grid">
              <div class="skeleton" style="height:80px; border-radius:var(--radius-lg);"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/websocket.js"></script>
  <script src="js/requests.js"></script>
</body>
</html>
