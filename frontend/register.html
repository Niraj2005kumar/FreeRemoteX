<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - RemoteX</title>
  <meta name="description" content="Register a new RemoteX account for secure, permission-governed remote desktop collaboration.">
  <link rel="icon" type="image/svg+xml" href="assets/logo/remotex-mark.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="auth-wrapper">
    <!-- Brand Header -->
    <div class="auth-brand">
      <a href="index.html">
        <img src="assets/logo/remotex-logo.svg" alt="RemoteX Logo" class="auth-brand-logo">
      </a>
      <span class="auth-badge">Permission-First Remote Platform</span>
    </div>

    <!-- Registration Card -->
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-header">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Configure your secure operator identity and Remote ID</p>
      </div>

      <form id="register-form" class="auth-form" novalidate>
        <!-- Full Name -->
        <div class="form-group">
          <label for="name" class="form-label">
            Full name <span class="required" aria-hidden="true">*</span>
          </label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-control"
            placeholder="Niraj Kumar"
            autocomplete="name"
            required
          >
          <div class="form-error" id="name-error"></div>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="email" class="form-label">
            Email address <span class="required" aria-hidden="true">*</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="operator@company.com"
            autocomplete="email"
            required
          >
          <div class="form-error" id="email-error"></div>
        </div>

        <!-- Remote ID -->
        <div class="form-group">
          <label for="remote-id" class="form-label">
            <span>Remote ID <span class="required" aria-hidden="true">*</span></span>
            <span class="form-helper">Unique peer address</span>
          </label>
          <div class="remote-id-generator">
            <input
              type="text"
              id="remote-id"
              name="remote_id"
              class="form-control"
              placeholder="RX-84920"
              autocomplete="off"
              required
            >
            <button
              type="button"
              class="btn btn-secondary btn-sm"
              id="generate-id-btn"
              title="Generate a random Remote ID"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              Auto
            </button>
          </div>
          <div class="form-error" id="remote-id-error"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">
            Password <span class="required" aria-hidden="true">*</span>
          </label>
          <div class="input-group">
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Minimum 6 characters"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              class="input-addon-btn toggle-pw-btn"
              data-target="password"
              aria-label="Toggle password visibility"
              tabindex="-1"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="form-error" id="password-error"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm-password" class="form-label">
            Confirm password <span class="required" aria-hidden="true">*</span>
          </label>
          <div class="input-group">
            <input
              type="password"
              id="confirm-password"
              name="confirm_password"
              class="form-control"
              placeholder="Repeat your password"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              class="input-addon-btn toggle-pw-btn"
              data-target="confirm-password"
              aria-label="Toggle password visibility"
              tabindex="-1"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="form-error" id="confirm-password-error"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-lg" id="submit-btn" style="width: 100%; margin-top: 0.5rem;">
          Create Account
        </button>
      </form>

      <!-- Card Footer -->
      <div class="auth-card-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>

    <!-- Security statement -->
    <div class="auth-security-notice">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Zero-knowledge connection architecture. You control every permission.</span>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
